<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Advanced Todo Card</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<section class="container">

  <article class="card" data-testid="test-todo-card">

    <!-- Priority Indicator -->
    <div id="priorityIndicator" data-testid="test-todo-priority-indicator"></div>

    <!-- HEADER -->
    <div class="header">
      <input
        type="checkbox"
        id="complete"
        data-testid="test-todo-complete-toggle"
        aria-label="Mark task as complete"
      />
      <h2 id="title" data-testid="test-todo-title"></h2>
    </div>

    <!-- DESCRIPTION -->
    <p id="description" data-testid="test-todo-description"></p>

    <button
      id="expandBtn"
      data-testid="test-todo-expand-toggle"
      aria-expanded="false"
      aria-controls="collapsible"
    >
      Show More
    </button>

    <div
      id="collapsible"
      data-testid="test-todo-collapsible-section"
      hidden
    >
      <p id="fullDescription"></p>
    </div>

    <!-- META -->
    <div class="meta">
      <span id="priority" data-testid="test-todo-priority"></span>
      <span id="status" data-testid="test-todo-status"></span>

      <select id="statusControl" data-testid="test-todo-status-control">
        <option>Pending</option>
        <option>In Progress</option>
        <option>Done</option>
      </select>
    </div>

    <!-- DUE DATE -->
    <time id="dueDate" data-testid="test-todo-due-date"></time>

    <!-- TIME -->
    <div id="timeRemaining" data-testid="test-todo-time-remaining" aria-live="polite"></div>
    <div id="overdueIndicator" data-testid="test-todo-overdue-indicator"></div>

    <!-- TAGS -->
    <ul class="tags" data-testid="test-todo-tags">
      <li data-testid="test-todo-tag-work">work</li>
      <li data-testid="test-todo-tag-design">design</li>
      <li data-testid="test-todo-tag-urgent">urgent</li>
    </ul>

    <!-- ACTIONS -->
    <div class="actions">
      <button data-testid="test-todo-edit-button" onclick="enterEditMode()">Edit</button>
      <button data-testid="test-todo-delete-button" onclick="handleDelete()">Delete</button>
    </div>

    <!-- EDIT FORM -->
    <div id="editForm" data-testid="test-todo-edit-form" hidden>

      <label>
        Title
        <input id="editTitle" data-testid="test-todo-edit-title-input" />
      </label>

      <label>
        Description
        <textarea id="editDesc" data-testid="test-todo-edit-description-input"></textarea>
      </label>

      <label>
        Priority
        <select id="editPriority" data-testid="test-todo-edit-priority-select">
          <option>Low</option>
          <option>Medium</option>
          <option>High</option>
        </select>
      </label>

      <label>
        Due Date
        <input type="datetime-local" id="editDate" data-testid="test-todo-edit-due-date-input" />
      </label>

      <button id="saveBtn" data-testid="test-todo-save-button">Save</button>
      <button id="cancelBtn" data-testid="test-todo-cancel-button">Cancel</button>

    </div>

  </article>

</section>

<script src="script.js"></script>
</body>
</html>
