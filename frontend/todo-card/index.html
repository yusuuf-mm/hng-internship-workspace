<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo Card</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<section class="container">

  <article class="card" data-testid="test-todo-card">

    <!-- HEADER -->
    <div class="header">
      <input
        type="checkbox"
        id="complete"
        data-testid="test-todo-complete-toggle"
        aria-label="Mark task as complete"
      />

      <h2 data-testid="test-todo-title" id="title">
        Build Todo Card Component
      </h2>
    </div>

    <!-- DESCRIPTION -->
    <p data-testid="test-todo-description">
      Create a fully accessible and responsive todo card with proper test IDs and semantic HTML.
    </p>

    <!-- PRIORITY + STATUS -->
    <div class="meta">

      <span
        class="priority high"
        data-testid="test-todo-priority"
        aria-label="Priority High"
      >
        High
      </span>

      <span
        class="status"
        data-testid="test-todo-status"
        id="status"
      >
        Pending
      </span>

    </div>

    <!-- DUE DATE -->
    <time
      data-testid="test-todo-due-date"
      datetime="2026-03-01T18:00:00Z"
      id="dueDate"
    >
      Due Mar 1, 2026
    </time>

    <!-- TIME REMAINING -->
    <div
      data-testid="test-todo-time-remaining"
      id="timeRemaining"
      aria-live="polite"
    >
      Loading time…
    </div>

    <!-- TAGS -->
    <ul role="list" class="tags" data-testid="test-todo-tags">

      <li class="tag" data-testid="test-todo-tag-work">work</li>
      <li class="tag" data-testid="test-todo-tag-design">design</li>
      <li class="tag" data-testid="test-todo-tag-urgent">urgent</li>

    </ul>

    <!-- ACTIONS -->
    <div class="actions">

      <button
        data-testid="test-todo-edit-button"
        onclick="handleEdit()"
      >
        Edit
      </button>

      <button
        data-testid="test-todo-delete-button"
        onclick="handleDelete()"
      >
        Delete
      </button>

    </div>

  </article>

</section>

<script src="script.js"></script>
</body>
</html>
